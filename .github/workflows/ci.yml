name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test readonly UI
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          npm run sync:embedded
      - name: Build binaries
        run: cargo build --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --all-targets --locked
      - name: Native adapters, Pi evidence and browser contract tests
        run: node --test integrations/tests/native.test.mjs integrations/tests/pi-context.test.mjs crates/server/tests/browser/*.test.cjs
      - name: Windows launcher and update safety tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./distribution/windows/test.ps1 -Taskd target/debug/taskd.exe
          ./distribution/windows/test-local.ps1
      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        run: |
          cd web
          npx --no-install playwright install --with-deps chromium
      - name: Browser smoke test
        if: runner.os == 'Linux'
        working-directory: web
        env:
          STEWARD_TEST_BIN_DIR: ${{ github.workspace }}/target/debug
          STEWARD_BROWSER_CHANNEL: chromium
        run: |
          STEWARD_TEST_UI_MODE=embedded npm run test:browser
          npm run test:browser
      - name: Upload browser screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: web/.artifacts/
          if-no-files-found: ignore
          retention-days: 7
