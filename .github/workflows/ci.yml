name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build binaries
        run: cargo build --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --all-targets --locked
      - name: Native adapter tests
        run: node --test integrations/tests/native.test.mjs
      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/steward-browser" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/steward-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/steward-browser/node_modules" >> "$GITHUB_ENV"
      - name: Browser smoke test
        if: runner.os == 'Linux'
        run: node crates/server/tests/browser/smoke.cjs
      - name: Upload browser screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: .local/m5-*.png
          if-no-files-found: ignore
          retention-days: 7
