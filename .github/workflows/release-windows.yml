name: Windows release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test readonly UI
        shell: bash
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          npm run sync:embedded
      - name: Install pinned Pi 0.85.1 for mandatory real-host regressions
        shell: pwsh
        run: |
          $binary = & ./.github/scripts/install-test-pi.ps1 -Destination "$env:RUNNER_TEMP/steward-release-test-pi-0.85.1"
          "STEWARD_TEST_PI_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STEWARD_REQUIRE_REAL_PI=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: cargo build --workspace --locked
      - name: Native adapters and task-context regressions (real Pi mandatory)
        shell: bash
        run: node --test integrations/tests/*.test.mjs crates/server/tests/browser/*.test.cjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Test release embedded readonly UI
        shell: bash
        working-directory: web
        env:
          STEWARD_TEST_BIN_DIR: ${{ github.workspace }}/target/release
          STEWARD_TEST_UI_MODE: embedded
          STEWARD_BROWSER_CHANNEL: chromium
        run: |
          npx --no-install playwright install chromium
          npm run test:browser
      - name: Test launcher and package
        shell: powershell
        run: |
          ./distribution/windows/test.ps1 -Taskd target/release/taskd.exe
          ./distribution/windows/test-local.ps1
      - name: Build release archive
        shell: powershell
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./distribution/windows/package.ps1 -Version $env:RELEASE_VERSION -Output "$env:RUNNER_TEMP/steward-release"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ${{ runner.temp }}/steward-release/*.zip
            ${{ runner.temp }}/steward-release/*.sha256
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --generate-notes --title "$TAG"
